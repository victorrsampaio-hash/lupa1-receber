<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Licitações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EAE3D2;
    --paper-deep:#DCD2B7;
    --card:#FBF8F0;
    --ink:#232B22;
    --ink-soft:#5B6353;
    --line:#C7BC9E;
    --gold:#A8792B;
    --gold-soft:#EADFC0;
    --green:#3F5D3A;
    --green-soft:#DCE6D5;
    --green-claro:#6FAE5E;
    --green-claro-bg:#E4F0DE;
    --red:#8A3324;
    --red-soft:#EFDAD3;
    --radius:14px;
    --shadow: 0 2px 0 rgba(35,43,34,0.06), 0 8px 24px -12px rgba(35,43,34,0.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:32px 24px 80px;
  }
  .app{max-width:1160px;margin:0 auto;}

  /* ---------- header ---------- */
  .topbar{
    display:flex;justify-content:space-between;align-items:flex-end;
    gap:20px;flex-wrap:wrap;margin-bottom:28px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;letter-spacing:.14em;
    color:var(--gold);font-weight:600;
    display:block;margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;font-size:34px;
    margin:0;letter-spacing:-.01em;
  }
  .topbar-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .search{
    font-family:'Inter';font-size:14px;
    padding:10px 14px;border-radius:10px;
    border:1px solid var(--line);background:var(--card);
    color:var(--ink);min-width:200px;
  }
  .search:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .btn-primary{
    font-family:'Inter';font-weight:600;font-size:14px;
    background:var(--ink);color:var(--card);
    border:none;border-radius:10px;padding:11px 18px;
    cursor:pointer;transition:transform .12s ease, background .12s ease;
  }
  .btn-primary:hover{background:#161c14;}
  .btn-primary:active{transform:scale(0.97);}
  .btn-ghost{
    font-family:'Inter';font-weight:600;font-size:14px;
    background:transparent;color:var(--ink-soft);
    border:1px solid var(--line);border-radius:10px;padding:10px 16px;
    cursor:pointer;
  }
  .btn-ghost:hover{background:var(--paper-deep);}

  /* ---------- funnel overview ---------- */
  .tabs{display:flex;gap:10px;margin-bottom:20px;border-bottom:1px solid var(--line);}
  .tab-btn{
    font-family:'Inter';font-weight:600;font-size:14px;
    background:none;border:none;cursor:pointer;
    padding:10px 4px 12px;color:var(--ink-soft);
    border-bottom:2px solid transparent;margin-bottom:-1px;
    display:flex;align-items:center;gap:8px;
  }
  .tab-btn .n{
    font-family:'IBM Plex Mono',monospace;font-size:11px;
    background:var(--paper-deep);color:var(--ink-soft);
    padding:1px 7px;border-radius:999px;
  }
  .tab-btn.active{color:var(--ink);border-bottom-color:var(--gold);}
  .tab-btn.active .n{background:var(--gold-soft);color:#6E4E1D;}

  .chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;color:var(--ink-soft);
    background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:8px 14px;cursor:pointer;
    display:flex;align-items:center;gap:8px;
    transition:border-color .12s ease, color .12s ease;
  }
  .chip .n{font-weight:600;color:var(--ink);}
  .chip:hover{border-color:var(--gold);}
  .chip.active{
    background:var(--ink);color:var(--paper);border-color:var(--ink);
  }
  .chip.active .n{color:var(--paper);}

  /* ---------- board ---------- */
  .board{display:flex;flex-direction:column;gap:16px;}
  .board[hidden]{display:none;}

  .card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:20px 22px;
    position:relative;
  }
  .card-top{
    display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
    margin-bottom:18px;
  }
  .card-id{
    font-family:'Fraunces',serif;font-weight:600;font-size:20px;
    margin:0 0 3px;
  }
  .nome-row{display:flex;align-items:center;gap:8px;}
  .btn-pago{
    width:57px;height:57px;border-radius:50%;flex-shrink:0;
    border:2px solid var(--green-claro);background:var(--green-claro-bg);
    color:var(--green-claro);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;padding:0;transition:transform .12s ease, background .12s ease, border-color .12s ease, color .12s ease;
    box-shadow:0 2px 6px rgba(111,174,94,0.3);
  }
  .btn-pago:hover{transform:scale(1.1);}
  .btn-pago svg{width:34px;height:23px;}
  .btn-pago.ativo{background:var(--green-claro);border-color:var(--green-claro);color:#fff;box-shadow:0 2px 8px rgba(111,174,94,0.5);}
  .card-produto{
    font-family:'IBM Plex Mono',monospace;font-size:13px;
    color:var(--gold);letter-spacing:.02em;font-weight:600;
  }
  .card-meta{
    text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end;
  }
  .valor-row{display:flex;align-items:center;gap:10px;}
  .valor{
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;
  }
  .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .tag{
    font-size:11px;font-family:'Inter';font-weight:600;
    background:var(--gold-soft);color:#6E4E1D;
    padding:3px 9px;border-radius:999px;
  }
  .tag.adesao{background:var(--green-soft);color:#2E4429;}

  .card-menu{position:absolute;top:16px;right:18px;}
  .menu-btn{
    background:none;border:none;cursor:pointer;color:var(--ink-soft);
    font-size:18px;line-height:1;padding:4px 8px;border-radius:6px;
  }
  .menu-btn:hover{background:var(--paper-deep);}
  .menu-pop{
    position:absolute;right:0;top:28px;background:var(--card);
    border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);
    display:none;flex-direction:column;min-width:150px;z-index:5;overflow:hidden;
  }
  .menu-pop.open{display:flex;}
  .menu-pop button{
    background:none;border:none;text-align:left;padding:10px 14px;
    font-family:'Inter';font-size:13px;cursor:pointer;color:var(--ink);
  }
  .menu-pop button:hover{background:var(--paper-deep);}
  .menu-pop button.danger{color:var(--red);}
  .confirm-row{
    display:flex;gap:6px;padding:10px 12px;align-items:center;
    font-size:12px;background:var(--red-soft);
  }
  .confirm-row button{
    font-size:12px;padding:5px 10px;border-radius:6px;border:none;cursor:pointer;
  }
  .confirm-row .yes{background:var(--red);color:#fff;}
  .confirm-row .no{background:var(--card);}

  /* ---------- stepper ---------- */
  .stepper{
    display:flex;align-items:flex-start;
    overflow-x:auto;padding-bottom:4px;padding-top:18px;
    gap:0;
  }
  .step{
    display:flex;flex-direction:column;align-items:center;
    flex:1;min-width:92px;position:relative;cursor:pointer;
    padding-top:2px;
  }
  .step-line{
    position:absolute;top:15px;left:-50%;width:100%;height:2px;
    background:var(--line);z-index:0;
  }
  .step:first-child .step-line{display:none;}
  .step-line.done{background:var(--green);}
  .dot{
    width:30px;height:30px;border-radius:50%;
    background:var(--card);border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;
    color:var(--ink-soft);z-index:1;position:relative;
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
  }
  .step:hover .dot{transform:scale(1.08);}
  .dot.done{background:var(--green);border-color:var(--green);color:#fff;}
  .dot.current{
    background:var(--gold);border-color:var(--gold);color:#fff;
    box-shadow:0 0 0 4px var(--gold-soft);
  }
  .step-label{
    font-size:10.5px;text-align:center;margin-top:8px;line-height:1.25;
    color:var(--ink-soft);max-width:88px;
  }
  .step.current .step-label{color:var(--ink);font-weight:600;}
  .step-status{
    position:absolute;top:-20px;font-family:'Inter';font-size:11px;font-weight:700;
    white-space:nowrap;
  }
  .step-status.feito{color:var(--green);}
  .step-status.fazer{color:var(--gold);}

  /* ---------- empty state ---------- */
  .relatorio-controles{
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;
    justify-content:space-between;margin-bottom:16px;
  }
  .relatorio-filtros{display:flex;gap:10px;flex-wrap:wrap;}
  .relatorio-card{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    overflow:hidden;
  }
  .tabela-relatorio{width:100%;border-collapse:collapse;}
  .tabela-relatorio th{
    text-align:left;font-family:'IBM Plex Mono',monospace;font-size:11px;
    letter-spacing:.06em;color:var(--ink-soft);text-transform:uppercase;
    padding:14px 20px;border-bottom:1px solid var(--line);background:var(--paper-deep);
  }
  .tabela-relatorio th.col-valor{text-align:right;}
  .tabela-relatorio td{
    padding:13px 20px;border-bottom:1px solid var(--line);font-size:14px;
  }
  .tabela-relatorio td.col-valor{
    text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:600;
  }
  .tabela-relatorio tr:last-child td{border-bottom:none;}
  .tabela-relatorio tr:hover td{background:var(--paper);}
  .tabela-relatorio tfoot td{
    font-family:'Fraunces',serif;font-weight:600;font-size:17px;
    padding:16px 20px;border-top:2px solid var(--ink);border-bottom:none;
    background:var(--gold-soft);
  }
  .tabela-relatorio tfoot td.col-valor{font-family:'IBM Plex Mono',monospace;}
  .relatorio-empty{padding:60px 20px;text-align:center;color:var(--ink-soft);font-family:'Fraunces',serif;font-size:18px;}
  .empty{
    text-align:center;padding:70px 20px;color:var(--ink-soft);
  }
  .empty p{font-family:'Fraunces',serif;font-size:19px;color:var(--ink);margin-bottom:16px;}

  /* ---------- modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(35,43,34,0.45);
    display:flex;align-items:center;justify-content:center;
    z-index:50;padding:20px;
  }
  .modal-backdrop[hidden]{display:none;}
  .modal{
    background:var(--card);border-radius:16px;padding:28px 26px;
    width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,0.3);
    animation:pop .16s ease;
  }
  @keyframes pop{from{transform:scale(.96);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal h2{font-family:'Fraunces',serif;font-weight:600;margin:0;font-size:22px;}
  .modal-header-row{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;
  }
  .btn-close-x{
    background:var(--paper);border:1px solid var(--line);border-radius:8px;
    width:32px;height:32px;font-size:15px;cursor:pointer;color:var(--ink-soft);
    flex-shrink:0;
  }
  .btn-close-x:hover{background:var(--red-soft);color:var(--red);border-color:var(--red);}
  .modal label{
    display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);
    margin-bottom:14px;
  }
  .modal input, .modal select{
    width:100%;margin-top:6px;padding:10px 12px;border-radius:8px;
    border:1px solid var(--line);font-family:'Inter';font-size:14px;
    background:var(--paper);color:var(--ink);
  }
  .modal input:focus, .modal select:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;}

  @media (max-width:640px){
    h1{font-size:26px;}
    .card-top{flex-direction:column;}
    .card-meta{align-items:flex-start;text-align:left;}
    .tags{justify-content:flex-start;}
  }

  /* ---------- login ---------- */
  .login-screen{
    position:fixed;inset:0;background:var(--paper);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;
  }
  .login-box{
    background:var(--card);border-radius:16px;padding:36px 30px;
    width:100%;max-width:360px;box-shadow:var(--shadow);text-align:left;
  }
  .login-box h1{font-size:26px;}
  .login-box label{
    display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:16px;
  }
  .login-box input{
    width:100%;margin-top:6px;padding:11px 12px;border-radius:8px;
    border:1px solid var(--line);font-family:'Inter';font-size:15px;
    background:var(--paper);color:var(--ink);
  }
  .login-erro{color:var(--red);font-size:12.5px;font-weight:600;margin:-6px 0 12px;}

  /* ---------- topbar / hamburger ---------- */
  .topbar-brand{display:flex;align-items:center;gap:12px;}
  .hamburger{
    display:none;flex-direction:column;justify-content:center;gap:4px;
    width:36px;height:36px;background:var(--card);border:1px solid var(--line);
    border-radius:8px;cursor:pointer;padding:0;flex-shrink:0;
  }
  .hamburger span{width:18px;height:2px;background:var(--ink);margin:0 auto;border-radius:1px;}
  .perfil-tag{
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
    background:var(--gold-soft);color:#6E4E1D;padding:6px 10px;border-radius:999px;
  }

  @media (max-width:820px){
    .hamburger{display:flex;}
    .topbar-actions{
      display:none;flex-direction:column;align-items:stretch;
      position:fixed;top:0;right:0;height:100vh;width:78%;max-width:300px;
      background:var(--card);box-shadow:-6px 0 24px rgba(0,0,0,0.2);
      padding:70px 18px 20px;z-index:60;gap:10px;
    }
    .topbar-actions.aberto{display:flex;}
    .topbar-actions .search, .topbar-actions select{min-width:0;}
  }

  .modo-visitante #btnNovo{display:none;}
  .modo-visitante .card-menu{display:none;}
  .modo-visitante .btn-pago{cursor:default;}
  .modo-visitante .step{cursor:default;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }

  @media print{
    body{background:#fff;padding:0;}
    .topbar, .tabs, .relatorio-controles, .login-screen, .hamburger{display:none !important;}
    .relatorio-card{box-shadow:none;border:1px solid #ccc;}
    .app{max-width:100%;}
    .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;page-break-inside:avoid;}
    .card-menu{display:none !important;}
    .stepper{overflow-x:visible;}
    .board{gap:10px;}
  }
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <span class="eyebrow">OBR · GESTÃO DE PROCESSOS</span>
    <h1 style="margin-bottom:22px;">Painel de Licitações</h1>
    <form id="formLogin">
      <label>Senha de acesso
        <input required id="loginSenha" type="password" placeholder="Digite sua senha" autocomplete="current-password">
      </label>
      <p class="login-erro" id="loginErro" hidden>Senha incorreta. Tente novamente.</p>
      <button type="submit" class="btn-primary" style="width:100%;margin-top:6px;">Entrar</button>
    </form>
  </div>
</div>

<div class="app" id="appMain" hidden>
  <div class="topbar">
    <div class="topbar-brand">
      <button class="hamburger" id="btnMenu" aria-label="Abrir menu">
        <span></span><span></span><span></span>
      </button>
      <div>
        <span class="eyebrow">OBR · GESTÃO DE PROCESSOS</span>
        <h1>Painel de Licitações</h1>
      </div>
    </div>
    <div class="topbar-actions" id="menuLateral">
      <input class="search" id="busca" placeholder="Buscar cliente ou produto...">
      <select class="search" id="ordenacao">
        <option value="nenhuma">Ordenar: padrão</option>
        <option value="desc">Mais em andamento primeiro</option>
        <option value="asc">Menos em andamento primeiro</option>
        <option value="valor-desc">Maior valor primeiro</option>
        <option value="valor-asc">Menor valor primeiro</option>
      </select>
      <button class="btn-ghost" id="btnPdfPrincipal">Gerar PDF</button>
      <button class="btn-primary" id="btnNovo">+ Novo cliente</button>
      <span class="perfil-tag" id="perfilTag"></span>
      <button class="btn-ghost" id="btnSair">Sair</button>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="board" id="board"></div>
  <div class="relatorio" id="relatorio" hidden></div>
  <div class="empty" id="empty" hidden>
    <p>Nenhum processo cadastrado ainda.</p>
    <p style="font-size:13px;color:var(--ink-soft);">Use o botão "+ Novo cliente" no canto superior direito para começar.</p>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal">
    <div class="modal-header-row">
      <h2 id="modalTitle">Novo cliente</h2>
      <button type="button" class="btn-close-x" id="btnFecharX" aria-label="Fechar">✕</button>
    </div>
    <form id="formCliente">
      <label>Cliente / Município
        <input required id="fNome" placeholder="Ex: Prefeitura de Campo Maior">
      </label>
      <label>Produto
        <input required id="fProduto" placeholder="Ex: Capacitação de Saúde">
      </label>
      <label>Valor estimado (R$)
        <input required id="fValor" type="text" inputmode="decimal" placeholder="Ex: 250.000,00">
      </label>
      <label>Forma de contratação
        <select id="fForma">
          <option value="Chamamento Público">Chamamento Público</option>
          <option value="Ata Própria">Ata Própria</option>
          <option value="Adesão">Adesão</option>
          <option value="Dispensa">Dispensa</option>
          <option value="Licitação Própria (Sem Ata)">Licitação Própria (Sem Ata)</option>
        </select>
      </label>
      <label id="lblAdesao">Adesão de onde
        <input id="fAdesao" placeholder="Ex: Canto do Buriti">
      </label>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="btnCancelar">Cancelar</button>
        <button type="submit" class="btn-primary">Salvar</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, getDocs, setDoc, deleteDoc, onSnapshot, writeBatch }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAI9E-MWhR4exFTlFyRgL0ngVe6iv-ewvA",
  authDomain: "comercial-lupa1.firebaseapp.com",
  projectId: "comercial-lupa1",
  storageBucket: "comercial-lupa1.firebasestorage.app",
  messagingSenderId: "349838430031",
  appId: "1:349838430031:web:46b4dae4f6493522a3bf3a"
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
const COLECAO = 'licitacoes';

async function salvarClienteDB(id, dados){
  await setDoc(doc(db, COLECAO, id), dados);
}
async function excluirClienteDB(id){
  await deleteDoc(doc(db, COLECAO, id));
}

const STORAGE_KEY = 'clientes-licitacoes';

const ETAPAS_ADESAO_PADRAO = [
  "À Contratar",
  "Emails Orçamento",
  "Adesão (Empresa)",
  "Adesão (Município)",
  "Adesão Concluída",
  "Agendar Execução",
  "Gerar Notas Fiscais",
  "Recebido"
];

const ETAPAS_CHAMAMENTO = [
  "Se Inscrever",
  "Declarado Vencedor",
  "Aguardar Recurso",
  "Vencedor (Formalizar Contrato)",
  "Segov/Sefaz",
  "Recebido"
];

const ETAPAS_ATA_PROPRIA = [
  "Criando Produto",
  "Cotação (Emails)",
  "Edital Lançado",
  "Licitação Feita",
  "Agendar Execução",
  "Gerar Notas Fiscais",
  "Recebido"
];

const ETAPAS_POR_FORMA = {
  "Chamamento Público": ETAPAS_CHAMAMENTO,
  "Ata Própria": ETAPAS_ATA_PROPRIA,
  "Licitação Própria (Sem Ata)": ETAPAS_ATA_PROPRIA
};

function getEtapas(forma){
  return ETAPAS_POR_FORMA[forma] || ETAPAS_ADESAO_PADRAO;
}

const MAX_ETAPAS = Math.max(
  ETAPAS_ADESAO_PADRAO.length,
  ETAPAS_CHAMAMENTO.length,
  ETAPAS_ATA_PROPRIA.length
);

let clientes = [];
let editandoId = null;
let menuAberto = null;
let abaAtual = 'ativos';
let relatorioOrdem = 'nome';
let relatorioServico = 'todos';

function fmtMoeda(v){
  return Number(v).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}

function parseValorBR(str){
  if(!str) return 0;
  const limpo = String(str).trim().replace(/\./g,'').replace(',', '.');
  const n = parseFloat(limpo);
  return isNaN(n) ? 0 : n;
}

function formatarValorParaInput(v){
  return Number(v).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

async function carregar(){
  try{
    const snap = await getDocs(collection(db, COLECAO));
    clientes = snap.docs.map(d=>({id:d.id, ...d.data()}));
  }catch(e){
    console.error('Erro ao carregar', e);
    clientes = [];
  }
  if(clientes.length === 0){
    const batch = writeBatch(db);
    SEED_DATA.forEach((c,i)=>{
      const id = 'c'+Date.now()+i;
      batch.set(doc(db, COLECAO, id), {
        nome:c.nome, produto:c.produto, valor:c.valor, forma:c.forma, adesao:c.adesao,
        situacao: 0, pago: false
      });
    });
    await batch.commit();
    const snap2 = await getDocs(collection(db, COLECAO));
    clientes = snap2.docs.map(d=>({id:d.id, ...d.data()}));
  }
  render();
  iniciarSincronizacao();
}

function iniciarSincronizacao(){
  onSnapshot(collection(db, COLECAO), snap=>{
    clientes = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }, (e)=>console.error('Erro de sincronização', e));
}

function abrirModal(id=null){
  editandoId = id;
  const modal = document.getElementById('modalBackdrop');
  const form = document.getElementById('formCliente');
  form.reset();
  if(id){
    const c = clientes.find(x=>x.id===id);
    document.getElementById('modalTitle').textContent = 'Editar cliente';
    document.getElementById('fNome').value = c.nome;
    document.getElementById('fProduto').value = c.produto;
    document.getElementById('fValor').value = formatarValorParaInput(c.valor);
    document.getElementById('fForma').value = c.forma;
    document.getElementById('fAdesao').value = c.adesao || '';
  } else {
    document.getElementById('modalTitle').textContent = 'Novo cliente';
  }
  toggleAdesaoField();
  modal.hidden = false;
  document.getElementById('fNome').focus();
}

function fecharModal(){
  document.getElementById('modalBackdrop').hidden = true;
  editandoId = null;
}

function toggleAdesaoField(){
  const forma = document.getElementById('fForma').value;
  document.getElementById('lblAdesao').style.display = (forma==='Adesão') ? 'block' : 'none';
}

document.getElementById('fForma').addEventListener('change', toggleAdesaoField);

document.getElementById('btnNovo').addEventListener('click', ()=>abrirModal());

document.getElementById('modalBackdrop').addEventListener('click', (e)=>{

});

document.getElementById('formCliente').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const nome = document.getElementById('fNome').value.trim();
  const produto = document.getElementById('fProduto').value.trim();
  const valor = parseValorBR(document.getElementById('fValor').value);
  const forma = document.getElementById('fForma').value;
  const adesao = document.getElementById('fAdesao').value.trim();

  if(editandoId){
    const c = clientes.find(x=>x.id===editandoId);
    const maxIdx = getEtapas(forma).length - 1;
    const situacao = Math.min(c.situacao||0, maxIdx);
    await salvarClienteDB(editandoId, {nome, produto, valor, forma, adesao, situacao, pago: c.pago||false});
  } else {
    const id = 'c'+Date.now();
    await salvarClienteDB(id, {nome, produto, valor, forma, adesao, situacao:0, pago:false});
  }
  fecharModal();
});

function excluir(id){
  excluirClienteDB(id);
}

function mudarEtapa(id, idx){
  const c = clientes.find(x=>x.id===id);
  salvarClienteDB(id, {...c, situacao: idx});
}

function renderTabs(){
  const el = document.getElementById('tabs');
  const nAtivos = clientes.filter(c=>c.situacao < getEtapas(c.forma).length - 1).length;
  const nRecebidos = clientes.filter(c=>c.situacao === getEtapas(c.forma).length - 1).length;
  el.innerHTML = `
    <button class="tab-btn ${abaAtual==='ativos'?'active':''}" data-tab="ativos">Em andamento <span class="n">${nAtivos}</span></button>
    <button class="tab-btn ${abaAtual==='recebidos'?'active':''}" data-tab="recebidos">Recebidos <span class="n">${nRecebidos}</span></button>
    <button class="tab-btn ${abaAtual==='relatorio'?'active':''}" data-tab="relatorio">Relatório <span class="n">${clientes.length}</span></button>
  `;
}

function renderBoard(){
  const board = document.getElementById('board');
  const empty = document.getElementById('empty');
  board.innerHTML = '';

  const busca = document.getElementById('busca').value.toLowerCase();
  let lista = clientes.filter(c=>{
    const ultimaEtapa = getEtapas(c.forma).length - 1;
    const matchAba = abaAtual==='recebidos' ? c.situacao===ultimaEtapa : c.situacao<ultimaEtapa;
    const matchBusca = !busca || c.nome.toLowerCase().includes(busca) || c.produto.toLowerCase().includes(busca);
    return matchAba && matchBusca;
  });

  const ordem = document.getElementById('ordenacao').value;
  if(ordem==='desc'){
    lista = lista.slice().sort((a,b)=>b.situacao - a.situacao);
  } else if(ordem==='asc'){
    lista = lista.slice().sort((a,b)=>a.situacao - b.situacao);
  } else if(ordem==='valor-desc'){
    lista = lista.slice().sort((a,b)=>b.valor - a.valor);
  } else if(ordem==='valor-asc'){
    lista = lista.slice().sort((a,b)=>a.valor - b.valor);
  }

  if(lista.length===0){
    empty.hidden = false;
    empty.querySelector('p').textContent = abaAtual==='recebidos'
      ? 'Nenhum processo recebido ainda.'
      : 'Nenhum processo cadastrado ainda.';
    return;
  }
  empty.hidden = true;

  lista.forEach(c=>{
    const card = document.createElement('div');
    card.className = 'card';

    const tags = [`<span class="tag">${c.forma}</span>`];
    if(c.forma==='Adesão' && c.adesao){
      tags.push(`<span class="tag adesao">${c.adesao}</span>`);
    }
    const etapasCliente = getEtapas(c.forma);

    card.innerHTML = `
      <div class="card-menu">
        <button class="menu-btn" data-menu="${c.id}">⋯</button>
        <div class="menu-pop" id="menu-${c.id}">
          <button data-edit="${c.id}">Editar dados</button>
          <button class="danger" data-del="${c.id}">Excluir</button>
        </div>
      </div>
      <div class="card-top">
        <div>
          <p class="card-id">${c.nome}</p>
          <span class="card-produto">${c.produto}</span>
        </div>
        <div class="card-meta">
          <div class="valor-row">
            <button class="btn-pago ${c.pago?'ativo':''}" data-pago="${c.id}" title="${c.pago ? 'Dinheiro recebido em conta' : 'Marcar como recebido em conta'}">
              <svg viewBox="0 0 26 18" xmlns="http://www.w3.org/2000/svg">
                <rect x="1" y="9" width="20" height="8.5" rx="1.6" fill="currentColor" opacity="0.35"></rect>
                <rect x="3" y="5" width="20" height="8.5" rx="1.6" fill="currentColor" opacity="0.62"></rect>
                <rect x="5" y="1" width="20" height="8.5" rx="1.6" fill="currentColor"></rect>
                <circle cx="15" cy="5.25" r="2.35" fill="var(--card)"></circle>
                <rect x="6.4" y="3.6" width="1.5" height="3.3" rx="0.6" fill="var(--card)" opacity="0.85"></rect>
                <rect x="22.1" y="3.6" width="1.5" height="3.3" rx="0.6" fill="var(--card)" opacity="0.85"></rect>
              </svg>
            </button>
            <span class="valor">${fmtMoeda(c.valor)}</span>
          </div>
          <div class="tags">${tags.join('')}</div>
        </div>
      </div>
      <div class="stepper">
        ${etapasCliente.map((nome, idx)=>{
          const done = idx < c.situacao;
          const current = idx === c.situacao;
          return `
            <div class="step ${current?'current':''}" data-step="${c.id}|${idx}">
              <div class="step-line ${idx<=c.situacao ? 'done':''}"></div>
              ${done ? '<span class="step-status feito">Feito</span>' : ''}
              ${current ? '<span class="step-status fazer">À Fazer</span>' : ''}
              <div class="dot ${done?'done':''} ${current?'current':''}">${idx+1}</div>
              <div class="step-label">${nome}</div>
            </div>`;
        }).join('')}
      </div>
    `;
    board.appendChild(card);
  });
}

function renderRelatorio(){
  const rel = document.getElementById('relatorio');
  const busca = document.getElementById('busca').value.toLowerCase();

  const servicos = [...new Set(clientes.map(c=>c.produto))].sort((a,b)=>a.localeCompare(b,'pt-BR'));

  let lista = clientes.filter(c=>{
    const matchBusca = !busca || c.nome.toLowerCase().includes(busca) || c.produto.toLowerCase().includes(busca);
    const matchServico = relatorioServico==='todos' || c.produto===relatorioServico;
    return matchBusca && matchServico;
  });

  if(relatorioOrdem==='nome'){
    lista = lista.slice().sort((a,b)=> a.nome.localeCompare(b.nome,'pt-BR'));
  } else if(relatorioOrdem==='valor-desc'){
    lista = lista.slice().sort((a,b)=> b.valor - a.valor);
  } else if(relatorioOrdem==='valor-asc'){
    lista = lista.slice().sort((a,b)=> a.valor - b.valor);
  }

  const total = lista.reduce((soma,c)=> soma + Number(c.valor||0), 0);

  const controles = `
    <div class="relatorio-controles">
      <div class="relatorio-filtros">
        <select class="search" id="relOrdem">
          <option value="nome" ${relatorioOrdem==='nome'?'selected':''}>Cliente A-Z</option>
          <option value="valor-desc" ${relatorioOrdem==='valor-desc'?'selected':''}>Maior valor primeiro</option>
          <option value="valor-asc" ${relatorioOrdem==='valor-asc'?'selected':''}>Menor valor primeiro</option>
        </select>
        <select class="search" id="relServico">
          <option value="todos" ${relatorioServico==='todos'?'selected':''}>Todos os serviços</option>
          ${servicos.map(s=>`<option value="${s}" ${relatorioServico===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <button class="btn-primary" id="btnPdf">Gerar PDF</button>
    </div>
  `;

  if(lista.length===0){
    rel.innerHTML = controles + `<div class="relatorio-empty">Nenhum contrato encontrado.</div>`;
  } else {
    rel.innerHTML = controles + `
      <div class="relatorio-card">
        <table class="tabela-relatorio">
          <thead>
            <tr>
              <th>Cliente</th>
              <th>Serviço</th>
              <th class="col-valor">Valor</th>
            </tr>
          </thead>
          <tbody>
            ${lista.map(c=>`
              <tr>
                <td>${c.nome}</td>
                <td>${c.produto}</td>
                <td class="col-valor">${fmtMoeda(c.valor)}</td>
              </tr>
            `).join('')}
          </tbody>
          <tfoot>
            <tr>
              <td colspan="2">Total (${lista.length} contrato${lista.length===1?'':'s'})</td>
              <td class="col-valor">${fmtMoeda(total)}</td>
            </tr>
          </tfoot>
        </table>
      </div>
    `;
  }

  document.getElementById('relOrdem').addEventListener('change', (e)=>{
    relatorioOrdem = e.target.value;
    renderRelatorio();
  });
  document.getElementById('relServico').addEventListener('change', (e)=>{
    relatorioServico = e.target.value;
    renderRelatorio();
  });
  document.getElementById('btnPdf').addEventListener('click', ()=>{
    window.print();
  });
}

function render(){
  renderTabs();
  const board = document.getElementById('board');
  const relatorio = document.getElementById('relatorio');
  const ordenacao = document.getElementById('ordenacao');
  if(abaAtual==='relatorio'){
    board.hidden = true;
    relatorio.hidden = false;
    ordenacao.style.display = 'none';
    renderRelatorio();
  } else {
    board.hidden = false;
    relatorio.hidden = true;
    ordenacao.style.display = '';
    renderBoard();
  }
}

document.addEventListener('click', (e)=>{
  const tabBtn = e.target.closest('[data-tab]');
  if(tabBtn){
    abaAtual = tabBtn.dataset.tab;
    render();
    return;
  }

  if(window.perfilAtual !== 'admin'){
    if(e.target.closest('[data-menu],[data-edit],[data-del],[data-step],[data-pago]')) return;
  }

  const menuBtn = e.target.closest('[data-menu]');
  if(menuBtn){
    const id = menuBtn.dataset.menu;
    document.querySelectorAll('.menu-pop').forEach(m=>{
      if(m.id !== 'menu-'+id) m.classList.remove('open');
    });
    document.getElementById('menu-'+id).classList.toggle('open');
    return;
  }
  const editBtn = e.target.closest('[data-edit]');
  if(editBtn){ abrirModal(editBtn.dataset.edit); return; }

  const delBtn = e.target.closest('[data-del]');
  if(delBtn){
    const menu = delBtn.closest('.menu-pop');
    menu.innerHTML = `
      <div class="confirm-row">
        Excluir processo?
        <button class="yes">Sim</button>
        <button class="no">Não</button>
      </div>`;
    menu.querySelector('.yes').onclick = ()=>excluir(delBtn.dataset.del);
    menu.querySelector('.no').onclick = ()=>menu.classList.remove('open');
    return;
  }

  const step = e.target.closest('[data-step]');
  if(step){
    const [id, idx] = step.dataset.step.split('|');
    mudarEtapa(id, Number(idx));
    return;
  }

  const pagoBtn = e.target.closest('[data-pago]');
  if(pagoBtn){
    const c = clientes.find(x=>x.id===pagoBtn.dataset.pago);
    if(!c.pago){
      const ok = confirm(`Marcar "${c.nome}" (${c.produto}) como recebido?\n\nEle vai sair da aba "Em andamento" e passar para "Recebidos".`);
      if(!ok) return;
    }
    c.pago = !c.pago;
    salvarClienteDB(id, {...c});
    return;
  }

  if(!e.target.closest('.card-menu')){
    document.querySelectorAll('.menu-pop').forEach(m=>m.classList.remove('open'));
  }
});

document.getElementById('busca').addEventListener('input', ()=>{
  if(abaAtual==='relatorio') renderRelatorio(); else renderBoard();
});
document.getElementById('ordenacao').addEventListener('change', renderBoard);
